name: Recuperacao Firestore - auditoria temporaria

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descobrir dados no Firestore sem expor valores
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("src/App.jsx", "utf8");
          const apiKey = source.match(/apiKey:\s*"([^"]+)"/)?.[1];
          const projectId = source.match(/projectId:\s*"([^"]+)"/)?.[1];
          if (!apiKey || !projectId) throw new Error("Firebase config nao encontrada");
          const base = "https://firestore.googleapis.com/v1/projects/" + projectId + "/databases/(default)/documents";

          async function json(url, opts={}) {
            const r = await fetch(url, opts);
            const body = await r.json();
            if (!r.ok) throw new Error((body.error && body.error.message) || ("HTTP " + r.status));
            return body;
          }

          const auth = await json("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + apiKey, {
            method: "POST", headers: {"Content-Type":"application/json"},
            body: JSON.stringify({returnSecureToken:true})
          });
          const headers = {Authorization:"Bearer " + auth.idToken};

          function idFromName(name) { return String(name).split("/").pop(); }
          function fieldsOf(doc) { return doc && doc.fields ? doc.fields : {}; }
          function arrayCount(fields, key) {
            const v = fields[key] && fields[key].arrayValue;
            return v && Array.isArray(v.values) ? v.values.length : 0;
          }
          function objectKeys(fields, key) {
            const v = fields[key] && fields[key].mapValue;
            return v && v.fields ? Object.keys(v.fields).length : 0;
          }

          const root = await json(base + "/artifacts?pageSize=100", {headers});
          const appDocs = root.documents || [];
          console.log("ARTIFACT_APP_COUNT=" + appDocs.length);

          for (const appDoc of appDocs) {
            const appId = idFromName(appDoc.name);
            console.log("APP=" + appId);

            try {
              const p = await json(base + "/artifacts/" + encodeURIComponent(appId) + "/public?pageSize=100", {headers});
              for (const docSnap of (p.documents || [])) console.log("PUBLIC_DOC=" + idFromName(docSnap.name));
            } catch (e) {
              console.log("PUBLIC_LIST_ERROR=" + e.message);
            }

            let financeDocs = [];
            try {
              const d = await json(base + "/artifacts/" + encodeURIComponent(appId) + "/public/data/finances?pageSize=100", {headers});
              financeDocs = d.documents || [];
            } catch (e) {
              console.log("FINANCES_LIST_ERROR=" + e.message);
            }
            console.log("FINANCES_DOC_COUNT=" + financeDocs.length);

            for (const docSnap of financeDocs) {
              const docId = idFromName(docSnap.name);
              const f = fieldsOf(docSnap);
              console.log("FINANCE_DOC=" + docId);
              console.log("FINANCE_UPDATE_TIME=" + (docSnap.updateTime || ""));
              for (const key of ["profiles","transactions","cards","cardPurchases","investments","goals","netWorthHistory","accounts"]) {
                console.log("COUNT_" + key + "=" + arrayCount(f,key));
              }
              console.log("KEYS_COUNT=" + Object.keys(f).length);
              console.log("PAID_STATEMENTS_KEYS=" + objectKeys(f,"paidStatements"));
            }
          }
          NODE
