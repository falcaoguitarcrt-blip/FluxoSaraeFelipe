name: Recuperacao Firestore - auditoria temporaria

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test current version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/recovery-read.mjs")
          s=p.read_text()
          a=s.index("const samples=[];")
          b=s.index("let best=null;",a)
          s=s[:a] + 'const samples=[new Date(Date.now()-5*60*1000).toISOString()];\n\n' + s[b:]
          p.write_text(s)
          PY
          node scripts/recovery-read.mjs
