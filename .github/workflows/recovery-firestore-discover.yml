name: Recuperacao Firestore - auditoria temporaria

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditoria somente leitura
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const source = readFileSync("src/App.jsx", "utf8");
          const apiKey = source.match(/apiKey:\s*"([^"]+)"/)?.[1];
          const projectId = source.match(/projectId:\s*"([^"]+)"/)?.[1];
          const currentAppId = source.match(/const appId = "([^"]+)"/)?.[1];

          if (!apiKey || !projectId || !currentAppId) {
            console.log("FIRESTORE_AUDIT_CONFIG_ERROR=true");
            process.exit(1);
          }

          const appIds = [
            currentAppId,
            "fluxo-casal-compartilhado-oficial-2026",
            "fluxo-casal-producao"
          ].filter((value, index, list) => list.indexOf(value) === index);

          const authUrl = "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + apiKey;
          const authResponse = await fetch(authUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ returnSecureToken: true })
          });
          const authBody = await authResponse.json();

          if (!authResponse.ok) {
            console.log("FIRESTORE_AUDIT_AUTH_ERROR=" + (authBody.error?.message || ("HTTP " + authResponse.status)));
            process.exit(1);
          }

          const idToken = authBody.idToken;

          async function inspectDoc(appId, suffix, label) {
            const path = ["artifacts", appId, "public", "data", "finances", suffix].map(encodeURIComponent).join("/");
            const url = "https://firestore.googleapis.com/v1/projects/" + projectId +
              "/databases/(default)/documents/" + path;
            const response = await fetch(url, { headers: { Authorization: "Bearer " + idToken } });
            const body = await response.json();

            if (response.status === 404 || body.error?.status === "NOT_FOUND") {
              console.log(label + "_EXISTS=false");
              return;
            }

            if (!response.ok) {
              console.log(label + "_ERROR=" + (body.error?.message || ("HTTP " + response.status)));
              return;
            }

            const fields = body.fields || {};
            console.log(label + "_EXISTS=true");
            console.log(label + "_TOP_LEVEL_KEY_COUNT=" + Object.keys(fields).length);
            for (const key of ["profiles","transactions","cards","cardPurchases","investments","goals","netWorthHistory","accounts"]) {
              const values = fields[key]?.arrayValue?.values;
              const type = fields[key]?.arrayValue ? "array" : fields[key]?.mapValue ? "object" : fields[key] ? "other" : "missing";
              console.log(label + "_" + key + "_TYPE=" + type);
              if (type === "array") console.log(label + "_" + key + "_COUNT=" + (Array.isArray(values) ? values.length : 0));
            }
          }

          for (const appId of appIds) {
            const safe = appId.replace(/[^A-Za-z0-9]+/g, "_").toUpperCase();
            console.log("=== APP_ID " + appId + " ===");
            await inspectDoc(appId, "shared_state", safe + "_PRIMARY");

            const backupLabel = safe + "_BACKUP";
            const backupPath = ["artifacts", appId, "public", "data", "finances", "shared_state_backup_weekly"].map(encodeURIComponent).join("/");
            const backupUrl = "https://firestore.googleapis.com/v1/projects/" + projectId +
              "/databases/(default)/documents/" + backupPath;
            const backupResponse = await fetch(backupUrl, { headers: { Authorization: "Bearer " + idToken } });
            const backupBody = await backupResponse.json();

            if (backupResponse.status === 404 || backupBody.error?.status === "NOT_FOUND") {
              console.log(backupLabel + "_EXISTS=false");
            } else if (!backupResponse.ok) {
              console.log(backupLabel + "_ERROR=" + (backupBody.error?.message || ("HTTP " + backupResponse.status)));
            } else {
              const fields = backupBody.fields || {};
              console.log(backupLabel + "_EXISTS=true");
              console.log(backupLabel + "_TOP_LEVEL_KEY_COUNT=" + Object.keys(fields).length);
              for (const key of ["profiles","transactions","cards","cardPurchases","investments","goals","netWorthHistory","accounts"]) {
                const values = fields[key]?.arrayValue?.values;
                const type = fields[key]?.arrayValue ? "array" : fields[key]?.mapValue ? "object" : fields[key] ? "other" : "missing";
                console.log(backupLabel + "_" + key + "_TYPE=" + type);
                if (type === "array") console.log(backupLabel + "_" + key + "_COUNT=" + (Array.isArray(values) ? values.length : 0));
              }
            }
          }
          NODE
