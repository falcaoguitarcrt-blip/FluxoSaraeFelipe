name: Recuperacao Firestore - auditoria temporaria

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test path
        run: |
          sed -i 's/fluxo-casal-compartilhado-oficial-2026/fluxo-casal-compartilhado-oficial/; s/const samples=.*/const samples=[new Date(Date.now()-5*60*1000).toISOString()];/' scripts/recovery-read.mjs
          node scripts/recovery-read.mjs
