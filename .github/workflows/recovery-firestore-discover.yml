name: Recuperacao Firestore - auditoria temporaria

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check legacy candidate
        run: |
          sed -i 's/fluxo-casal-compartilhado-oficial-2026/fluxo-casal-compartilhado-oficial","fluxo-casal-compartilhado-oficial-2026/' scripts/recovery-read.mjs
          node scripts/recovery-read.mjs
