name: Recuperacao Firestore - auditoria temporaria

on:
  push:
    branches: ["recovery-firestore-audit"]

permissions:
  contents: read

jobs:
  audit-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificacao
        run: node ./scripts/recovery-read.mjs