name: Data protection checks

on:
  push:
    branches:
      - audit/protecao-dados-2026-10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-fluxo-casal-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run data-protection unit tests
        run: npm run test:data-protection
      - name: Run Firestore Emulator integration tests
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project demo-fluxo-casal-test
          --config tests/firebase/firebase.json
          "npm run test:integration"
      - name: Build production bundle without deployment
        run: npm run build
